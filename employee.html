<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>JEMS Adventure - Medarbejder Portal</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/equipmentOverview.css">
    <link rel="stylesheet" href="css/employee.css">
    <link rel="stylesheet" href="css/addEquipmentForm.css">
</head>
<body>

<!-- Login screen (shown until the employee authenticates) -->
<div id="loginScreen">
    <header>
        <nav>
            <a class="logo" href="index.html">JEMS Adventure</a>
            <span class="nav-portal-label">Medarbejder Portal</span>
        </nav>
    </header>
    <div class="login-container">
        <div class="login-card">
            <h2>Medarbejder Login</h2>
            <p class="login-subtitle">Log ind med din arbejdsmail og adgangskode</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="din@email.dk" required>
                </div>
                <div class="form-group">
                    <label for="password">Adgangskode</label>
                    <input type="password" id="password" placeholder="Efternavn + 4 sidste cifre" required>
                </div>
                <div id="loginError" class="login-error hidden">Forkert email eller adgangskode</div>
                <button type="submit" class="login-btn">Log ind</button>
            </form>

            <a href="index.html" class="back-link">← Tilbage til forsiden</a>
        </div>
    </div>
</div>

<!-- Dashboard (hidden until login succeeds) -->
<div id="dashboard" class="hidden">
    <header>
        <nav>
            <a class="logo" href="employee.html">JEMS Adventure</a>
            <ul class="nav-list">
                <li class="nav-item">
                    <!-- onclick removed — listeners are attached in employee.js -->
                    <a href="#" id="nav-udstyr" class="nav-active">Udstyr</a>
                </li>
                <li class="nav-item">
                    <a href="#" id="nav-aktiviteter">Aktiviteter</a>
                </li>
                <li class="nav-item">
                    <a href="#" id="nav-logout" class="nav-logout">Log ud</a>
                </li>
            </ul>
        </nav>
    </header>

    <div class="content"></div>
</div>

<!-- Single module entry point — imports config, equipmentOverview, and activityManagement -->
<script type="module" src="employeeJS/employee.js"></script>
</body>
</html>
